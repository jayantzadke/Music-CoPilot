services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saavn
      POSTGRES_PASSWORD: saavn
      POSTGRES_DB: saavn_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src

volumes:
  postgres_data:
